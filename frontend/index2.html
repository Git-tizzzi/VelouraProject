<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del Vendedor - Tienda de Ropa</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header>
    <div class="header-content">
      <a href="index1.html">
        <img src="img/veloura.svg" alt="veloura" height="80px">
      </a>
      <nav>
        <a href="index1.html">Ver tienda</a>
      </nav>
      <button class="btn-cerrar-sesion" data-logout>Cerrar sesión</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <h3>Panel del vendedor</h3>
        <nav class="admin-nav">
          <button class="admin-nav-btn active" data-section="productos">Productos</button>
        </nav>
        <button class="btn-cerrar-sesion" data-logout>Cerrar sesión</button>
      </aside>

      <div class="admin-content">
        <section class="admin-panel active" data-panel="productos">
          <h2>Gestión de Productos</h2>

          <form id="formProductoAgregar" class="admin-form">
            <input type="hidden" id="editingId">

            <label for="nombre">Nombre del producto</label>
            <input type="text" id="nombre" required>

            <label for="precio">Precio</label>
            <input type="number" id="precio" step="0.01" min="0" required>

            <label for="stock">Stock</label>
            <input type="number" id="stock" min="0" step="1" required>

            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" rows="3"></textarea>

            <label for="caracteristicas">Características</label>
            <textarea id="caracteristicas" rows="3"></textarea>

            <label for="imagen">Imagen principal (URL o ruta)</label>
            <input type="text" id="imagen" placeholder="Ej: img/CH.jpg" required>

            <label for="imagenes">Imágenes adicionales para el carrusel</label>
            <textarea id="imagenes" rows="3" placeholder="Una URL por línea"></textarea>
            <p class="form-ayuda">Escribí una ruta o URL por línea. La imagen principal también se muestra en el carrusel.</p>

            <button id="submitProducto" type="submit">Agregar producto</button>
          </form>

          <h3 class="admin-subtitulo">Productos añadidos</h3>
          <div class="tabla-container">
            <table id="tablaProductosVendedor">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th>Nombre</th>
                  <th>Precio</th>
                  <th>Imagen</th>
                  <th>Stock</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 veloura<br>veloura@gmail.com</p>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
