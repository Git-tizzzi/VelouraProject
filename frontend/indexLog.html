<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Tienda de Ropa</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <header>
    <a href="index1.html">
      <img src="img/veloura.svg" alt="veloura" width="300px">
    </a>
    <h1>Acceso a Veloura</h1>
  </header>

  <main>
    <section class="login-box">
      <div class="login-tabs">
        <button class="login-tab active" type="button" data-tab="login">Ingresar</button>
        <button class="login-tab" type="button" data-tab="registro">Crear cuenta</button>
      </div>

      <form id="loginForm" class="login-form active">
        <h2>Acceso al sistema</h2>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="Ej: admin@veloura.com" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Tu contraseña" required>

        <button type="submit">Ingresar</button>
      </form>

      <form id="registroForm" class="login-form">
        <h2>Crear cuenta</h2>

        <label for="regNombre">Nombre y apellido</label>
        <input type="text" id="regNombre" placeholder="Ej: Martina Lalin" required>

        <label for="regDni">DNI</label>
        <input type="text" id="regDni" placeholder="Ej: 12345678" inputmode="numeric" pattern="[0-9]{7,8}" title="Solo números, 7 u 8 dígitos" required>

        <label for="regTelefono">Teléfono</label>
        <input type="tel" id="regTelefono" placeholder="Ej: 1122334455" required>

        <label for="regDireccion">Dirección</label>
        <input type="text" id="regDireccion" placeholder="Calle, número, ciudad" required>

        <label for="regEmail">Correo electrónico</label>
        <input type="email" id="regEmail" placeholder="tucorreo@mail.com" required>

        <label for="regPassword">Contraseña</label>
        <input type="password" id="regPassword" minlength="4" placeholder="Mínimo 4 caracteres" required>

        <label for="regPassword2">Repetir contraseña</label>
        <input type="password" id="regPassword2" minlength="4" placeholder="Repetí tu contraseña" required>

        <button type="submit">Crear cuenta</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 veloura<br>veloura@gmail.com</p>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
